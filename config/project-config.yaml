active_provider: openrouter
slash_commands:
  - command: "research_codebase"
    recipe_path: "/Volumes/YBG1TB4Mac/AnkiTov/recipes/ankitov-research.yaml"
  - command: "design_discussion"
    recipe_path: "/Volumes/YBG1TB4Mac/AnkiTov/recipes/ankitov-design.yaml"
  - command: "create_plan"
    recipe_path: "/Volumes/YBG1TB4Mac/AnkiTov/recipes/ankitov-plan.yaml"
providers:
  custom_deepseek:
    enabled: true
    model: deepseek-v4-flash
    configured: true
  openrouter:
    enabled: true
    model: openrouter/auto-beta
    configured: true
  openrouter-qwen-coder:
    enabled: true
    model: qwen/qwen-3-coder-235b-a22b
    configured: true
GOOSE_MODE: smart_approve
GOOSE_TOOLSHIM: true
GOOSE_THINKING_EFFORT: off
GOOSE_TELEMETRY_ENABLED: false

# OpenRouter Auto Router config — auto-selects cheapest adequate model per task
# cost_quality_tradeoff: 7 = balanced quality/cost (0=quality, 10=cheapest)
# Tiered model pool (all support tool calling — required by Goose extensions):
#   🟢 Cheap: DeepSeek V4 Flash
#   🟡 Medium: Qwen3 92B, Mistral Large 3
#   🔴 Hard: Qwen3 Coder 235B, DeepSeek V4 Pro, Claude Sonnet 4, GPT-5
# Models like Phi-4, Gemma, Gemini Flash Lite, Llama 4 are excluded because
# they do NOT support tool/function calling on OpenRouter (causes 404 errors).
# Dedicated provider 'openrouter-qwen-coder' available for explicit hard-Rust tasks:
#   goose session -r --provider openrouter-qwen-coder
OPENROUTER_PARAMETERS:
  plugins:
    - id: auto-router
      # Tradeoff: 7 lets the router consider quality for hard tasks
      # while still being cost-conscious for simple ones.
      # (0=quality, 10=cheapest)
      cost_quality_tradeoff: 7
      # IMPORTANT: Only models that support tool/function calling are listed.
      # Goose requires tool calling for extensions (analyze, developer, etc.).
      # Models like Phi-4, Gemma, Gemini Flash Lite, Llama 4 do NOT support
      # tool calling on OpenRouter — they'd cause "No endpoints found" errors.
      allowed_models:
        # 🟢 Cheap — daily driver, simple tasks
        - deepseek/deepseek-v4-flash

        # 🟡 Medium — medium Rust, frontend, i18n, design
        - qwen/qwen-3-92b
        - mistral/mistral-large-3

        # 🔴 Hard — complex architecture, Rust systems, FSRS math
        - qwen/qwen-3-coder-235b-a22b
        - deepseek/deepseek-v4-pro
        - anthropic/claude-sonnet-4
        - openai/gpt-5*
