extensions:
  computercontroller:
    enabled: false
    type: builtin
    name: computercontroller
    description: General computer control tools that don't require you to be a developer or engineer.
    display_name: Computer Controller
    timeout: 300
    bundled: true
    available_tools: []
  memory:
    enabled: true
    type: builtin
    name: memory
    description: Teach goose your preferences as you go.
    display_name: Memory
    timeout: 600
    bundled: true
    available_tools: []
  autovisualiser:
    enabled: false
    type: builtin
    name: autovisualiser
    description: Data visualization and UI generation tools
    display_name: Auto Visualiser
    timeout: 300
    bundled: true
    available_tools: []
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
    available_tools: []
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
    available_tools: []
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
    available_tools: []
  code_execution:
    enabled: false
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
    available_tools: []
  todo:
    enabled: false
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
    available_tools: []
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
    available_tools: []
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
    available_tools: []
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
    available_tools: []
  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true
    available_tools: []
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
    available_tools: []
  chatrecall:
    enabled: true
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
    available_tools: []
  summarize:
    enabled: false
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
    available_tools: []
  tutorial:
    enabled: false
    type: builtin
    name: tutorial
    description: Access interactive tutorials and guides
    display_name: Tutorial
    timeout: 300
    bundled: true
    available_tools: []

  # AST Code Graph (tree-sitter based, MCP-native)
  code-graph:
    enabled: true
    type: stdio
    name: Code Graph
    cmd: code-graph-mcp
    args:
    - serve
    timeout: 900

  # Knowledge Graph Memory (official MCP server)
  memory-graph:
    enabled: true
    type: stdio
    name: Knowledge Graph Memory
    cmd: npx
    args:
    - -y
    - "@modelcontextprotocol/server-memory"
    env:
      # ARCHITECTURE NOTE: This path will be templated by bootstrap.sh.
      # The {{ANKITOV_REPO}} variable is substituted during install.
      MEMORY_FILE_PATH: "{{ANKITOV_REPO}}/.goose/memory-graph/memory.jsonl"
    timeout: 600

  # Headroom MCP — context compression for LLM requests
  headroom-mcp:
    enabled: true
    type: stdio
    name: Headroom MCP
    cmd: "{{HEADROOM_CMD}}"
    args:
    - mcp
    - serve
    - --proxy-url
    - http://127.0.0.1:8787
    timeout: 900

OPENROUTER_HOST: https://localhost:8787
active_provider: openai
providers:
  openai:
    enabled: true
    model: openrouter/auto
    configured: true
  custom_agnes:
    enabled: true
    model: agnes-2.5-flash
    configured: true
GOOSE_TELEMETRY_ENABLED: true
GOOSE_THINKING_EFFORT: high
OPENAI_BASE_URL: http://localhost:8787/v1
OPENAI_HOST: http://localhost:8787
OPENAI_BASE_PATH: v1/chat/completions
OPENAI_TIMEOUT: '600'
OPENAI_TARGET_API_URL: https://openrouter.ai/api/v1
# ARCHITECTURE NOTE: GOOSE_SHELL points to a wrapper that sources user profile
# for consistent PATH. bootstrap.sh will resolve the correct path.
GOOSE_SHELL: "{{GOOSE_SHELL_CMD}}"