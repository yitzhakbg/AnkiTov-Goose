version: "1.0.0"
title: "Bootstrap Session"
description: "Initialize working context from .goose/briefs/latest.md and verify Jujutsu repository state."

instructions: |
  Initialize working context for a new session efficiently without redundant file reads.

  1. Read `.goose/briefs/latest.md` if it exists to retrieve the previous session's handoff state.
  2. Sync and inspect Jujutsu state via developer shell commands:
     a. Run `jj git fetch` FIRST. AnkiTov-C is worked on from more than one machine;
        a stale local view re-creates already-pushed work (2026-10-12 incident: a full
        local chain duplicated commits pushed from another box, costing a rebase +
        abandon cycle to clean up).
     b. Then `jj log --limit 5` and `jj status`.
     c. If the local chain under `@` is NOT rooted in current `main` (diverged from
        origin), reconcile BEFORE any new work: `jj rebase -s <chain-root> -d main`,
        resolve conflicts favoring `main` for files the remote side evolved, and
        abandon working-copy changes that become `(empty)` after the rebase (they
        are duplicates). Never re-implement changes that already exist on `main`.
  3. Verify current compilation sanity via `cargo check` (in `backend/` or repo root as appropriate).
  4. Compare the state in `latest.md` against actual repository state (check branch/bookmark, working copy changes).
  5. Formulate a concise **Active Working Envelope** (under 200 words):
     - Current Goal / Prong
     - Active Branch / Bookmark & Base Commit
     - Current Working Set (modified/relevant files)
     - Top Priority Immediate Action
  6. Present the summary to the operator and request confirmation before proceeding with work.
