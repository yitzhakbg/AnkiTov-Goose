version: "1.0.0"
title: "OpenCode Coding Agent"
description: >
  Delegate coding tasks to OpenCode as a controlled sub-agent. OpenCode is a
  terminal-native AI coding agent that can read, edit, grep, and run bash
  commands. Goose directs it with precise instructions and collects results.

parameters:
  - key: task
    input_type: string
    requirement: required
    description: "The coding task to execute — be specific about files, changes, and constraints"

settings:
  max_turns: 10
  extensions:
    - type: builtin
      name: developer
      timeout: 300
      bundled: true

instructions: |
  Execute the following task using OpenCode in non-interactive mode.

  Task: {{ task }}

  ## Protocol
  1. Run: `opencode run --model openrouter/stealth/ox-alpha --auto --format json "{{ task }}"`
  2. Parse JSON output lines for `type: "text"` to get the response
  3. Parse `type: "error"` for failures
  4. Parse `type: "step_finish"` for token/cost accounting

  ## Constraints
  - OpenCode can read, write, edit, grep, and run bash commands
  - The `--auto` flag auto-approves permissions
  - Always use `--format json` for parseable output

  ## Output
  Provide a structured summary of what was done, files changed, and token cost.