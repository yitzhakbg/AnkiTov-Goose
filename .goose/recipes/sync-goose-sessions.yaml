name: sync-goose-sessions
description: >
  Sync Goose chat sessions between the Mac and the ybgXPS laptop. Use when asked
  to mirror/backup/restore Goose sessions across machines. Args: "mac" (Mac is
  source -> restore on laptop) or "laptop" (laptop is source -> restore on Mac).
model: default

recipe: |
  Sync Goose sessions between the Mac (ybgmacmini) and the ybgXPS laptop (ybgxps)
  using the git-backed snapshot/restore script.

  The user requested direction: {{ .args }}

  ## How it works
  - Live DB: ~/.local/share/goose/sessions/sessions.db (SQLite; WAL — cannot
    real-time sync, so we snapshot it).
  - Script: <this-repo>/scripts/sync-sessions.sh  (syncs via mutagen, present on
    both machines). It snapshots to ~/.goose-sessions-archive/sessions-<key>.db
    and pushes to GitHub (yitzhakbg/AnkiTov-Sessions); the other machine pulls.
  - Machine keys: mac -> sessions-ybgmacmini.db ; laptop -> sessions-ybgxps.db.
  - `restore` AUTO-RUNS `remap`, rewriting each session's working_dir to the
    nearest existing local path (or $HOME) so foreign paths don't fail to load.

  ## Steps
  Determine direction from the arg:
  - "mac"   = Mac is SOURCE. Snapshot on Mac, restore on laptop.
  - "laptop" = Laptop is SOURCE. Snapshot on laptop, restore on Mac.
  (Default if arg is empty/unknown: ask the user which direction.)

  1. Snapshot on the SOURCE machine:
       cd ~/AnkiTov-goose && bash scripts/sync-sessions.sh snapshot
     (Run locally if you are on the source; otherwise via SSH — Mac key
      ~/.ssh/id_ed25519_4_AnkiTov target ybg@ybgxps, laptop->Mac target
      ybg@mac-mini key ~/.ssh/id_ed25519_mac_sync.)

  2. On the TARGET machine, ENSURE Goose is NOT running first (it must be quit,
     since restore replaces the live DB):
       pgrep -x goose && { pkill -x goose; pkill -f 'goose serve'; sleep 1; }

  3. Restore on the target:
       cd ~/AnkiTov-goose && bash scripts/sync-sessions.sh restore <mac|laptop>
     where the key is the SOURCE machine's friendly key. This pulls the latest
     snapshot, replaces sessions.db, then auto-remaps working_dir to local paths.

  4. Verify both machines match:
       sqlite3 ~/.local/share/goose/sessions/sessions.db 'SELECT COUNT(*) FROM sessions'
     Report the count on both and confirm they are equal.

  ## Notes
  - Never rsync the workspace — it is owned by mutagen (ankitov-goose 2-way
    session). Only sessions.db + config dirs move here.
  - Config (custom_providers/, memory/, buzz agents/harnesses) syncs separately
    via goose-buzz-sync.sh (Mac->laptop) and goose-sync-reverse.sh (laptop->Mac).
  - Backups sessions.db.pre-restore / sessions.db.pre-remap are left in the live
    dir; tell the user they can delete them once satisfied.
  - Reference doc with full detail: docs/GOOSE-SYNC.md
