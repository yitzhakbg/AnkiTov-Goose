version: "1.0.0"
title: "AnkiTov Create Plan"
description: >
  Create an execution-level plan from research and design docs.
  Outputs to specs/plans/. Step 3 of the AnkiTov RPI workflow.

instructions: |
  Plan the implementation. Do NOT implement. Use `jj` not `git`.
  Build commands: `cd backend && cargo check`, `cargo nextest run`.

  1. Read the research doc AND design discussion doc fully. These constrain the plan.
  2. If the docs have gaps, close them using the Code Graph extension and the
     analyze extension directly (there are no separate sub-recipes):
       - `codegraph__get_ast_node` (include_references / include_impact) to confirm a
         symbol's signature, callers, and blast radius before planning around it
       - `codegraph__get_call_graph` to trace a function or HTTP route
       - `codegraph__project_map` / `codegraph__module_overview` to confirm module layout
       - `analyze` for directory structure and file/LOC context
     Use ripgrep for exact string/pattern lookups.
  3. Ask clarifying questions you can't answer from the docs.
  4. Propose phase structure. Get feedback before writing details.
  5. Write `specs/plans/YYYY-MM-DD-HHmm-<description>.md` using `specs/templates/plan-template.md`.

  Each phase MUST be a vertical slice: end-to-end path (model + controller + test +
  utoipa annotation) that is independently verifiable with `cargo check` + `cargo nextest run`.
  Horizontal phases (e.g., "all models first") are NOT allowed.

  The plan must include: exact file paths, code snippets, checkboxes for every
  verification item, "What We're NOT Doing" section.

parameters:
  - key: context
    input_type: string
    requirement: optional
    default: ""
    description: "Path to design discussion doc (preferred) or research doc"

extensions:
  - type: builtin
    name: developer
    timeout: 300
    bundled: true
  - type: builtin
    name: analyze
    timeout: 300
    bundled: true
  - type: stdio
    name: code-graph
    display_name: Code Graph
    cmd: code-graph-mcp
    args:
    - serve

prompt: |
  {% if context %}
  Read this fully and create an implementation plan: {{ context }}
  Prefer a design discussion doc from specs/design/. If only a research doc is
  provided, read it and ask whether a design discussion was done first.
  {% else %}
  Provide the path to a design discussion doc (from /design_discussion) or
  research doc (from /research_codebase).
  {% endif %}

  Each plan phase must be a vertical slice — end-to-end and independently testable.
  Do NOT create horizontal phases like "all models first."
