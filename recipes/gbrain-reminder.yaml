version: "1.0.0"
title: "Implement GBrain"
description: >
  Scheduled nudge to actually implement GBrain (github.com/garrytan/gbrain) as a
  goose memory/context MCP server. Predecessor verdict (July 2026) was "try the
  built-in Memory extension first, add GBrain only if it fell short." That trial
  never ran to completion — the built-in Memory extension is currently
  enabled: false, and GBrain was never installed. Walk the install, wire the
  stdio MCP server into goose config, verify recall, and report GO/NO-GO.
instructions: |
  Scheduled check-in: time to decide on GBrain and, if GO, implement it.

  ## Pre-flight: current state (re-verify, do not trust these numbers)

  Run these first — the picture may have moved since this recipe was written:

    grep -n -A6 '^  memory:' ~/.config/goose/config.yaml   # built-in Memory ext
    command -v gbrain || echo "gbrain not installed"
    bun --version 2>/dev/null || echo "bun not installed"
    ls ~/.config/goose/memory/ 2>/dev/null | wc -l

  State as of writing: built-in Memory is `enabled: false`; gbrain is NOT
  installed; `~/.config/goose/memory/` holds ~47 hand-maintained notes (mostly
  symlinks into AnkiTov-goose/memory/global), which is NOT the same thing as
  extension-managed memory.

  ## Step 1 — Report, don't assume

  Tell the user plainly that the original July 2026 plan ("try built-in Memory
  for two months first") was never actually exercised, so there is no trial
  result to interpret. Ask whether to:

    (a) enable the built-in Memory extension now and defer GBrain, or
    (b) proceed straight to GBrain.

  Default to (b) if the user has no strong preference — that is the standing
  intent of this reminder. Do not install anything until they confirm. If they
  say "go" / "yes" / "do it", proceed straight through Steps 2-5 without
  stopping again.

  ## Step 2 — Install GBrain (only after confirmation)

  ⚠️ CRITICAL TRAP: GBrain is NOT distributed on npm. The npm package named
  `gbrain` is an UNRELATED package. Never run `npm install -g gbrain` or
  `bun add -g gbrain` — the missing `github:` prefix is the trap.

  GBrain is a Bun + TypeScript runtime and needs Bun >= 1.4.0:

    curl -fsSL https://bun.sh/install | bash
    export PATH="$HOME/.bun/bin:$PATH"
    bun install -g github:garrytan/gbrain
    gbrain --version

  Recovery paths if the global install misbehaves:

    # Bun can block the postinstall hook on global installs, leaving schema_version: 0
    gbrain apply-migrations --yes --no-autopilot-install
    # deterministic fallback:
    git clone https://github.com/garrytan/gbrain.git ~/gbrain && cd ~/gbrain
    bun install && bun link

  Verify health with `gbrain doctor`.

  ## Step 3 — Local brain, no Docker

    gbrain init --pglite

  Start keyless — a keyword-only brain needs no API key. Only enable cloud
  embedding/reranking/synthesis later, and warn the user that those providers
  receive text before turning them on.

  ## Step 4 — Wire the stdio MCP server into goose

  Add to ~/.config/goose/config.yaml under `extensions:` (local stdio server;
  `gbrain serve` is the stdio entrypoint, `gbrain serve --http` is for HTTP):

    extensions:
      gbrain:
        name: GBrain
        cmd: gbrain
        args: [serve]
        enabled: true
        type: stdio
        timeout: 300

  Restart goose (Desktop: Settings → Extensions) and confirm the tools appear.

  ## Step 5 — Verify memory actually round-trips

    gbrain search "ankitov"          # or a fact you know is stored
    # then, inside a goose session with the extension enabled, ask the agent to
    # recall it. Keyword retrieval must return the fact before you call this done.

  ## Step 6 — Report

  Give a GO/NO-GO with evidence: installed version, `gbrain doctor` output,
  a successful recall, and whether the built-in Memory extension should now be
  left off (recommended — running both invites split-brain memory).

  ## Notes / optional follow-ups

  - Remote use: `gbrain mcp expose` publishes the brain over MCP on the
    Tailscale tailnet. Relevant here — the Mac (ybgmacmini) and the ybgxps
    laptop already share a tailnet, so one brain could serve both.
  - gbrain ships a System One guide that explicitly discusses "TypeSafe Jev" as
    an `llm:` provider option. This repo already integrates Jev
    (AnkiTov feat(jev) translator), so that path may be worth reading if the
    user wants gbrain and the Jev work to reinforce each other:
    https://github.com/garrytan/gbrain/blob/master/docs/guides/system-one.md
  - Doc map for agents: llms.txt (full) / AGENTS.md (operating protocol).
    Read AGENTS.md before driving the CLI — every gbrain error follows a
    machine contract (`code` -> `fix.next` -> `fix.verify`; exit 3 = stop and
    ask the user).
  - Supersedes scheduled_recipes/agent_created_1783603386.yaml, which framed
    this as a read-only GO/NO-GO evaluation. Recommend deleting that one to
    avoid two conflicting reminders.

extensions:
  - type: builtin
    name: developer
    timeout: 300
    bundled: true

settings:
  max_turns: 40

prompt: |
  GBrain implementation check-in. First re-verify the current state (built-in
  Memory enabled?, gbrain installed?, bun present?). Then report that the
  July 2026 "try the built-in Memory extension first" trial never ran, and
  recommend GO/NO-GO on GBrain. If the user confirms, install via Bun from
  `github:garrytan/gbrain` (NEVER npm), init with `gbrain init --pglite`, wire
  the `gbrain serve` stdio MCP server into ~/.config/goose/config.yaml, and
  verify recall works before reporting success. If they have not confirmed, stop
  after the recommendation and wait.