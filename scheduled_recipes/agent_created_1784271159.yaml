version: "1.0.0"
title: "Automated Video Generator in Rust — Monthly Review"
description: >
  Monthly review of research material for building an automated video generator in Rust.
  Visits a Gemini share link and Google Doc for ongoing reference material, then
  evaluates the Rust video generation ecosystem for feasibility, maturity, and
  architectural approach.

instructions: |
  Review the feasibility of building an automated video generator in Rust.

  This is a read-only research task. Do NOT make any changes to the codebase.

  1. Review these reference documents:
     - https://share.gemini.google/pQPouxd8HsdA
     - https://docs.google.com/document/d/1XplsnCqt_TTmURArNhe8G5f9JOu4MtQkPXahkAfVUnI/edit?usp=sharing

  2. Scan the Rust video/rendering ecosystem for noteworthy developments:
     - Check crates.io for new/popular crates related to: video encoding, frame rendering,
       subtitle overlays, audio mixing, compositing
     - Check ffmpeg-next (or similar FFmpeg bindings) for API changes
     - Check any Rust-native video processing frameworks
     - Note any new projects, releases, or blog posts about Rust video generation

  3. Evaluate the month-over-month maturity:
     - Are there new Rust video libraries worth tracking?
     - Have any existing projects reached a stability milestone?
     - What's the current state of headless rendering in Rust?
     - Any WASM-based video preview tooling progress?
     - Performance benchmarks vs established Python/moviepy pipelines?

  4. Compare approaches:
     - Pure Rust video encoding (rav1e, x264 crate bindings)
     - FFmpeg CLI subprocess orchestration
     - FFmpeg library bindings (ffmpeg-next)
     - Custom frame buffer → encoder pipeline
     - GPU-accelerated rendering (wgpu, vulkano)

  5. Write findings to `specs/research/YYYY-MM-DD-automated-video-generator.md` with:
     - Status of the two reference documents (still accessible, relevant)
     - New ecosystem developments this month
     - Updated feasibility assessment
     - Recommended architectural approach (if any change)
     - GO/NO-GO recommendation for building the generator

extensions:
  - type: builtin
    name: developer
    timeout: 300
    bundled: true

prompt: |
  Monthly review of automated video generator in Rust research.
  Visit reference links, scan Rust video ecosystem for changes,
  evaluate feasibility, write findings to specs/research/.
  GO/NO-GO recommendation required.