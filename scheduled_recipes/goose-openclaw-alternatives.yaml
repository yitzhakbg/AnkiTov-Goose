version: "1.0.0"
title: "Goose OpenClaw Alternatives Analysis"
description: >
  Reference recipe documenting the decision framework for OpenClaw alternatives
  in the Goose ecosystem. Evaluates Gemini's two recommended approaches (custom
  Rust micro-agent vs Pipedream/n8n) against Goose's built-in capabilities:
  goose schedule, goose serve, goose run, and recipe-based automation.

instructions: |
  You are a Goose environment architect. Your task is to evaluate whether any
  new "headless background operator" tool should be introduced alongside Goose,
  or whether Goose's built-in capabilities suffice.

  ## Background Context

  Gemini recommended two alternatives to OpenClaw for headless background automation:

  1. **Custom Rust Micro-Agent** (tokio + teloxide + reqwest) — a lean, compiled
     Telegram bot daemon running as a background service.
  2. **Pipedream / n8n** — an event-driven workflow engine as a webhook gateway.

  However, Goose already ships equivalents for both:

  | Capability | Goose Built-in |
  |---|---|
  | Background daemon | `goose serve` as launchd/systemd service |
  | Cron-triggered execution | `goose schedule` with cron expressions |
  | Headless execution | `goose run` with recipe + instructions |
  | Structured JSON output | Recipes with `response.json_schema` |
  | Retry + validation | Recipe `retry` block with `max_retries` and `checks` |
  | Isolated task execution | Subagents via `delegate()` tool |
  | Parameterized workflows | Recipes with `parameters` block |

  ## Evaluation Protocol

  When assessing whether to add a new tool or sidecar:

  1. **Check if Goose already does it** — look at `goose schedule`, `goose serve`,
     `goose run`, and recipe features first.
  2. **Check the AnkiTov weed-out rules** — no gRPC, no LangChain/LangGraph,
     no Agent Zero, no non-compiled runtimes for core infrastructure.
  3. **If a bridge is needed** (e.g., Telegram listener), prefer a thin Rust
     sidecar that calls `goose schedule run-now` rather than duplicating
     Goose's execution engine.
  4. **Budget gate** — any new sidecar must route through the existing
     `ankitov-budget-gate` for rate limiting and model spend routing.

  ## Decision Record

  Decision: Do NOT introduce OpenClaw. Goose natively covers all headless
  automation needs. The only gap is a Telegram/chat bridge, which would be
  a thin teloxide sidecar calling into Goose's schedule API, not a full
  agent runtime.

  Last evaluated: 2026-07-09

  If this is a scheduled run, produce a structured JSON report with:
  - `goose_capabilities_adequate`: boolean
  - `gaps_identified`: array of strings (features Goose doesn't have)
  - `recommendation`: string (one of "no-action", "build-bridge", "replace-component")
  - `rationale`: string

parameters:
  - key: trigger
    input_type: string
    requirement: optional
    default: "quarterly-review"
    description: "What triggered this evaluation (quarterly-review, new-tool-proposal, security-alert)"

extensions:
  - type: builtin
    name: developer
    timeout: 300
    bundled: true
  - type: builtin
    name: extensionmanager
    timeout: 300
    bundled: true

prompt: |
  Quarterly check: has the OpenClaw ecosystem (or any new headless agent
  framework) matured enough to warrant reconsidering our Goose-only approach?
  Evaluate against the decision framework in the instructions. If no change,
  confirm with a structured JSON report. If a new tool has emerged, escalate
  with a detailed comparison.

response:
  json_schema:
    type: object
    properties:
      goose_capabilities_adequate:
        type: boolean
        description: "Whether Goose's built-in features still cover all headless automation needs"
      gaps_identified:
        type: array
        items:
          type: string
        description: "Features Goose doesn't natively provide that a new tool would"
      recommendation:
        type: string
        enum: ["no-action", "build-bridge", "replace-component"]
        description: "What action to take"
      rationale:
        type: string
        description: "Explanation of the decision"
    required:
      - goose_capabilities_adequate
      - gaps_identified
      - recommendation
      - rationale