version: "1.0.0"
title: "gbrain Reminder Check"
description: >
  Reminder to evaluate whether gbrain (github.com/garrytan/gbrain) is worth
  adding to your personal goose development environment as a memory/context
  MCP server. Two months ago you agreed to try the built-in Memory extension
  first and only add gbrain if the built-in fell short.

instructions: |
  Read-only research task. Do NOT make any changes.

  Two months ago (July 2026), you evaluated memory/context options for your
  personal goose development environment and landed on this plan:

  1. Enable the built-in Memory extension (done July 2026)
  2. Use it for two months to see if it covers your needs
  3. Only consider adding gbrain if the built-in hit its ceiling

  Your task:
  1. Check whether the built-in Memory extension is still enabled in
     ~/.config/goose/config.yaml (or wherever your goose config lives)
  2. Check ~/.config/goose/memory/ and any local .goose/memory/ dirs for
     actual usage — are there stored memories, or did you never use it?
  3. Ask the user: has the built-in Memory extension been useful? What's
     missing?
  4. If relevant, re-evaluate gbrain:
     - https://github.com/garrytan/gbrain
     - 25K+ stars, MCP-native, PGLite local mode (no server/Docker)
     - Adds: hybrid search, knowledge graph, synthesis + gap analysis
     - Integration: one stdio extension entry in goose config
  5. Present a GO/NO-GO recommendation with reasoning.

extensions:
  - type: platform
    name: developer
    timeout: 300
  - type: platform
    name: analyze
    timeout: 300

prompt: |
  Two-month gbrain check-in. Determine whether the built-in Memory
  extension was sufficient or if gbrain should be added now.
  Present a GO/NO-GO recommendation.